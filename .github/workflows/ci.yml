name: CI

on:
  push:
    branches: ["**"]

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static analysis (flake8)
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run unit tests
        run: pytest tests/ -v

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static analysis (flake8)
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run unit tests
        run: pytest tests/ -v